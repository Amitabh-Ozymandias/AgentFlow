- table:
    dataset: default
    schema: public
    name: organizations
  array_relationships:
    - name: members
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: org_members
    - name: workflows
      using:
        foreign_key_constraint_on:
          column: org_id
          table:
            schema: public
            name: workflows
  select_permissions:
    - role: owner
      permission:
        columns: '*'
        filter:
          members:
            user_id:
              _eq: X-Hasura-User-Id
    - role: editor
      permission:
        columns: '*'
        filter:
          members:
            user_id:
              _eq: X-Hasura-User-Id
    - role: viewer
      permission:
        columns: '*'
        filter:
          members:
            user_id:
              _eq: X-Hasura-User-Id

- table:
    dataset: default
    schema: public
    name: org_members
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  select_permissions:
    - role: owner
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id

- table:
    dataset: default
    schema: public
    name: workflows
  object_relationships:
    - name: organization
      using:
        foreign_key_constraint_on: org_id
  array_relationships:
    - name: steps
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_steps
    - name: triggers
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_triggers
    - name: runs
      using:
        foreign_key_constraint_on:
          column: workflow_id
          table:
            schema: public
            name: workflow_runs
  select_permissions:
    - role: owner
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: viewer
      permission:
        columns: '*'
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  insert_permissions:
    - role: owner
      permission:
        check:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        check:
          org_id:
            _eq: X-Hasura-Org-Id
  update_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
    - role: editor
      permission:
        filter:
          org_id:
            _eq: X-Hasura-Org-Id
  delete_permissions:
    - role: owner
      permission:
        filter:
          org_id:
            _eq: X-Hasura-Org-Id

- table:
    dataset: default
    schema: public
    name: workflow_steps
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id

- table:
    dataset: default
    schema: public
    name: workflow_triggers
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id

- table:
    dataset: default
    schema: public
    name: workflow_runs
  object_relationships:
    - name: workflow
      using:
        foreign_key_constraint_on: workflow_id
  array_relationships:
    - name: step_runs
      using:
        foreign_key_constraint_on:
          column: workflow_run_id
          table:
            schema: public
            name: step_runs

- table:
    dataset: default
    schema: public
    name: step_runs
  object_relationships:
    - name: workflow_run
      using:
        foreign_key_constraint_on: workflow_run_id
