actions:
  - name: triggerWorkflowRun
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/trigger-workflow-run"
      forward_client_headers: true
    permissions:
      - role: owner
      - role: editor
  - name: approveStep
    definition:
      kind: synchronous
      handler: "{{NHOST_FUNCTIONS_URL}}/approve-step"
      forward_client_headers: true
    permissions:
      - role: owner
      - role: editor
custom_types:
  enums: []
  input_objects: []
  objects:
    - name: TriggerWorkflowRunOutput
      fields:
        - name: success
          type: Boolean!
        - name: workflowRunId
          type: String!
        - name: status
          type: String!
        - name: message
          type: String
    - name: ApproveStepOutput
      fields:
        - name: success
          type: Boolean!
        - name: runId
          type: String!
        - name: stepRunId
          type: String!
        - name: status
          type: String!
        - name: approvedBy
          type: String
        - name: approvedAt
          type: String
        - name: message
          type: String
  scalars: []
