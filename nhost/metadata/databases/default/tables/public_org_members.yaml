table:
  schema: public
  name: org_members

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: editor
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: viewer
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id