table:
  schema: public
  name: workflows

object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id

array_relationships:
  - name: steps
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_steps

  - name: triggers
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_triggers

  - name: runs
    using:
      foreign_key_constraint_on:
        column: workflow_id
        table:
          schema: public
          name: workflow_runs

select_permissions:
  - role: owner
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: editor
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: viewer
    permission:
      columns: '*'
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

insert_permissions:
  - role: owner
    permission:
      check:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: editor
    permission:
      check:
        org_id:
          _eq: X-Hasura-Org-Id

update_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

  - role: editor
    permission:
      filter:
        org_id:
          _eq: X-Hasura-Org-Id

delete_permissions:
  - role: owner
    permission:
      filter:
        org_id:
          _eq: X-Hasura-Org-Id